[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-bug-report-tool"
version = "0.1.0"
description = "A beginner-friendly CLI that turns rough QA notes into structured Markdown bug reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "KintsugiKoko" }
]

[project.scripts]
qa-bug-report-tool = "bug_report_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
