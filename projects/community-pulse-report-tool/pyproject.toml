[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "community-pulse-report-tool"
version = "0.1.0"
description = "A local CSV reporting support prototype that turns fictional community feedback records into Markdown feedback review reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "KintsugiKoko" }
]

[project.scripts]
community-pulse-report-tool = "community_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
