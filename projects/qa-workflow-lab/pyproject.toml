[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-workflow-lab"
version = "0.1.0"
description = "Bounded QA agents, executable game-state checks, and traceable review packets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Keith McAvoy"}]

[project.scripts]
qa-workflow-lab = "qa_workflow_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
